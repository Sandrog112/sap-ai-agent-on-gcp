# Builds the tool server from source with Cloud Native Buildpacks, the same way `gcloud builds submit --pack` does, but
# with logging that works for a custom build service account. Substitutions are passed by terraform/tool_server.tf.
steps:
  - name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - $_IMAGE
      - --builder
      - $_BUILDER
      - --network
      - cloudbuild
      - --env
      - GOOGLE_PYTHON_VERSION=$_PYTHON_VERSION
      - --env
      - GOOGLE_ENTRYPOINT=$_ENTRYPOINT
images:
  - $_IMAGE
options:
  logging: CLOUD_LOGGING_ONLY
